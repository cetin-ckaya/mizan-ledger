spring.application.name=mizan

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

spring.datasource.username=mizan

spring.datasource.password=${DB_PASSWORD}

#validate: Hibernate tablolara yine dokunmaz, ama açılışta entity’lerin
#tablolarla uyuşup uyuşmadığını kontrol eder. Uyuşmazlık varsa uygulama hiç açılmaz.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false